name: Publish an agent-containers target

on:
  workflow_call:
    inputs:
      target:
        description: The compose service whose image to publish
        required: true
        type: string
      compose-file:
        description: Path of the compose file declaring it
        default: docker-compose.yml
        type: string
      paths:
        description: Extra space-separated globs whose change rebuilds the image, e.g. lockfiles
        default: ""
        type: string
      tool-ref:
        description: The agent-containers ref to plan the build with; match the ref in your `uses:` line
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: agent-containers-publish-${{ github.repository }}-${{ inputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install agent-containers
        env:
          TOOL_REF: ${{ inputs.tool-ref }}
        run: uv tool install "git+https://github.com/learningequality/agent-containers@$TOOL_REF"

      - name: Plan the build
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          EXTRA_PATHS: ${{ inputs.paths }}
        run: |
          plan=$(agent-containers build-plan "$TARGET" --compose-file "$COMPOSE_FILE" --paths "$EXTRA_PATHS")
          {
            echo "context=$(jq -r .context <<<"$plan")"
            echo "dockerfile=$(jq -r .dockerfile <<<"$plan")"
            echo "stage=$(jq -r .stage <<<"$plan")"
            echo "watched=$(jq -r '.watched | map(":(glob)" + .) | join(" ")' <<<"$plan")"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the target changed
        id: changed
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          AFTER: ${{ github.sha }}
          WATCHED: ${{ steps.plan.outputs.watched }}
        run: |
          built=$(docker buildx imagetools inspect "$IMAGE:default" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' \
            || true)
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$built" ] || ! git cat-file -e "$built^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$AFTER" "$built"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            read -ra pathspecs <<<"$WATCHED"
            changed=$(git diff --name-only "$built" "$AFTER" -- "${pathspecs[@]}")
            echo "build=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.plan.outputs.context }}
          file: ${{ steps.plan.outputs.dockerfile }}
          target: ${{ steps.plan.outputs.stage }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.plan.outputs.image }}:default
            ${{ steps.plan.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
